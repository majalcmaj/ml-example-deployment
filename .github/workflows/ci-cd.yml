name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: make sync
      - run: make lint

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: make sync
      - run: make test-unit

  test-e2e:
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: make sync
      - run: make test-e2e

  # main: staging -> prod, each a manual-approval gate (configure required reviewers once in
  # repo Settings -> Environments -> staging / production).
  deploy-staging:
    needs: test-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: make deploy-staging

  deploy-prod:
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - run: make deploy-prod

  # feature branches: dev (manual-approval gate, configure once) -> ephemeral per-branch deploy
  # (auto, gated behind deploy-dev's approval, own dynamic environment for isolation/visibility).
  deploy-dev:
    needs: test-e2e
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      branch_slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - id: slug
        run: echo "slug=$(printf '%s' '${{ github.ref_name }}' | tr -c 'a-zA-Z0-9-' '-' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
      - run: make deploy-dev

  deploy-dev-ephemeral:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-${{ needs.deploy-dev.outputs.branch_slug }}
    steps:
      - uses: actions/checkout@v4
      - run: make deploy-dev-ephemeral BRANCH=${{ github.ref_name }}
