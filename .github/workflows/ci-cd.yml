name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'Manual deploy target'
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: make sync
      - run: make lint

  test-unit:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: make sync
      - run: make test-unit

  test-e2e:
    needs: test-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: make sync
      - run: make test-e2e

  test-compose:
    needs: test-e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@v3
      - run: make sync
      - run: make test-compose

  # main: staging deploys automatically on every push to main. prod is manual-only (workflow_dispatch,
  # target=prod), restricted to main via this job's `if` AND via Settings -> Environments -> prod ->
  # Deployment branches = main (belt-and-suspenders). Add required reviewers on the prod environment
  # if you also want a separate-approver gate on top of the manual trigger.
  deploy-staging:
    needs: test-compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - run: make deploy-staging

  deploy-prod:
    needs: test-compose
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'prod'
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - run: make deploy-prod

  # feature branches: manual per-branch dev deploy (workflow_dispatch, target=dev). Self-service —
  # any repo collaborator with write access can dispatch it for their own branch; do not add
  # required reviewers to dev-* environments. environment: dev-<branch> exists purely for
  # per-branch isolation/visibility in the Deployments UI, not as an approval gate.
  deploy-dev:
    needs: test-compose
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.target == 'dev'
    runs-on: ubuntu-24.04
    environment: dev-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - run: make deploy-dev BRANCH=${{ github.ref_name }}
