name: CI/CD (tests)

# Reusable test pipeline — lint through compose smoke. Called by test.yml (every push/PR on
# non-main branches) and by deploy-main.yml / deploy-dev.yml (so each deploy path validates
# itself with a fresh run, rather than trusting a separate workflow's result).
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: make sync
      - run: make lint

  test-unit:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: make sync
      - run: make test-unit

  test-e2e:
    needs: test-unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: make sync
      - run: make test-e2e

  test-compose:
    needs: test-e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@v3
      - run: make sync
      - run: make test-compose
