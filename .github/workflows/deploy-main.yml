name: CI/CD (main)

# staging deploys automatically on every push to main. prod is manual-only (workflow_dispatch),
# restricted to main via each job's `if` AND via Settings -> Environments -> prod -> Deployment
# branches = main (belt-and-suspenders). A prod dispatch also re-runs deploy-staging first
# (`needs: deploy-staging` gates deploy-prod on that having succeeded) so prod never ships behind
# a staging deploy that hasn't been verified in this same run. Add required reviewers on the prod
# environment if you also want a separate-approver gate on top of the manual trigger.
#
# deploy-dev doesn't exist in this file on purpose — dispatching here from main never shows a dev
# deploy job. See deploy-dev.yml for feature-branch deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  tests:
    uses: ./.github/workflows/ci-cd.yml

  deploy-staging:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - run: make deploy-staging

  deploy-prod:
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - run: make deploy-prod
