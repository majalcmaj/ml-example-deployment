[project]
name = "ml-deployment"
version = "0.1.0"
description = "A demonstration production-ready ML project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    "jupyter>=1.1.1",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.ruff.lint]
# Extend default rules (E, F) with additional strict categories
extend-select = [
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (optional, for strict typing)
    "PTH",    # flake8-use-pathlib
    "ARG",    # flake8-unused-arguments
    "TCH",    # flake8-type-checking
]
