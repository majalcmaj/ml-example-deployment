[project]
name = "ml-deployment"
version = "0.1.0"
description = "A demonstration production-ready ML project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "common",
    "inference",
    "training",
    "testkit",
    "ruff>=0.15.17",
    "debugpy>=1.8.21",
    "jupyter>=1.1.1",
    "pyright>=1.1.414",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/*"]

[tool.uv.sources]
common = { workspace = true }
inference = { workspace = true }
training = { workspace = true }
testkit = { workspace = true }

[tool.ruff]
extend-exclude = ["*.ipynb"]
# Databricks injects these as globals at runtime; never defined locally.
builtins = ["dbutils"]

[tool.ruff.lint]
extend-select = ["B", "C4", "RET", "SIM", "UP", "ANN", "PTH", "ARG", "TCH"]

[tool.pyright]
include = ["src"]
exclude = ["**/*.ipynb", "**/outputs"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--import-mode=importlib"
markers = ["e2e: executes a notebook end-to-end"]
